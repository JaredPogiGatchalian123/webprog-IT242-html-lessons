<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Surprise ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="player"></div>

    <div id="game-container">
        <div id="ui-layer">
            <h1 class="game-text">Catch 5 hearts to reveal a surprise...</h1>
            <div id="score-box">Hearts: <span id="score">0</span></div>
        </div>
        
        <div id="heart-zone"></div>

        <div id="valentine-card" class="hidden">
            <img src="assets/haha.jpg" class="photo top-left">
            <img src="assets/haha2.jpg" class="photo bottom-right">
            
            <div class="card-content">
                <h2 class="script-font">will you be my</h2>
                <h1 class="neon-title">VALENTINE</h1>
                
                <div class="neon-heart-container">
                    <div class="neon-heart">❤️</div>
                </div>

                <div class="selection-area">
                    <p class="instruction">PLEASE SELECT BELOW</p>
                    <div class="choice-row">
                        <div class="checkbox"></div>
                        <button id="yes-btn" class="neon-btn">YES</button>
                    </div>
                    <div class="choice-row">
                        <div class="checkbox"></div>
                        <button id="no-btn" class="neon-btn">YES</button> 
                    </div>
                </div>
            </div>
        </div>

        <div id="success-screen" class="hidden">
            <h1 class="script-font bounce success-text">YAY! ❤️ See you on the 14th!</h1>
            <div class="photo-wrap">
                 <img src="assets/haha3.jpg" class="reveal-img">
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
