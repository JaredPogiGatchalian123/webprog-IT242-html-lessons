<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="player" style="position: absolute; visibility: hidden;"></div>

    <div id="game-container">
        <div id="ui-layer">
            <h1 class="main-title">Catch 5 hearts to reveal a surprise...</h1>
            <div id="score-pill">Hearts: <span id="score">0</span></div>
        </div>
        
        <div id="heart-zone"></div>

        <div id="valentine-card" class="hidden">
            <div class="card-content">
                <img src="YOUR_PHOTO_LEFT.jpg" class="photo photo-left" alt="Us">
                <img src="YOUR_PHOTO_RIGHT.jpg" class="photo photo-right" alt="Us">
                
                <h2 class="script-font">will you be my</h2>
                <h1 class="neon-text">VALENTINE</h1>
                
                <div class="neon-heart-frame">
                    <div class="inner-heart">❤️</div>
                </div>

                <div class="button-zone">
                    <p class="select-text">PLEASE SELECT BELOW</p>
                    <div class="btn-container">
                        <div class="checkbox-box"></div>
                        <button id="yes-btn">YES</button>
                    </div>
                    <div class="btn-container">
                        <div class="checkbox-box"></div>
                        <button id="no-btn">No</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="success-screen" class="hidden">
            <h1 class="script-font bounce">YAY! ❤️ See you on the 14th!</h1>
            <div class="final-photo-frame">
                <img src="YOUR_FINAL_PHOTO.jpg" alt="Success Photo">
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>
</html>
